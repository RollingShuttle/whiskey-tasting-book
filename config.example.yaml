# Whiskey Tasting Book — configuration TEMPLATE.
# Copy this to config.yaml and fill in the paths for your machine:
#     cp config.example.yaml config.yaml     (Windows: copy config.example.yaml config.yaml)
# config.yaml is gitignored because its paths contain a local username; this template is not.
# Nothing in here is a secret — the client/tenant IDs below are public identifiers, not credentials.

paths:
  # READ ONLY. The app must never call .save() on this — see SPEC.md §1.1 and §8.
  master_workbook: "C:/Users/YOUR_USERNAME/OneDrive/文档/Whiskey File/Whiskey Collection.xlsx"
  read_only_master: true

  # Generated rollup of the journal, for reading in Excel. Regenerated whole by the PC app.
  rollup_workbook: "C:/Users/YOUR_USERNAME/OneDrive/文档/Whiskey File/Whiskey Tastings.xlsx"

  # The OneDrive app folder — shared with the phone. Created on first write, not by registration.
  app_folder: "C:/Users/YOUR_USERNAME/OneDrive/Apps/Whiskey Tasting Book"

  local_data: "./data"
  backups: "./data/backups"
  backup_keep: 30

# Microsoft Graph — phone client only. The PC app reads the synced folder directly and needs none
# of this. The client ID is a public identifier from your own Entra app registration (SETUP.md
# Part 3), not a secret — but fill in your own here rather than committing it.
auth:
  client_id: "YOUR_CLIENT_ID"
  # "Personal accounts only" registration -> consumers authority, NOT common.
  authority: "https://login.microsoftonline.com/consumers"
  scopes:
    - "Files.ReadWrite.AppFolder"     # the ONLY Graph scope. Never widen this.
  redirect_uri_dev: "http://localhost:8765"
  redirect_uri_prod: ""               # filled in once the static host exists
  # A personal-accounts app authenticates against /consumers; no tenant/directory ID is needed.

server:
  host: "127.0.0.1"
  port: 8765
  bind_lan: false        # true also serves the phone on the home network

rubric:
  name: Curiosity Public Ultimate Spirits
  version: 1
  total: sum
  decimals: 1
  # `question` is the text behind the ? on each row — the tooltip that keeps scoring consistent
  # across months. Transcribed verbatim from the physical card (SPEC.md §3).
  categories:
    - key: aroma
      label: Aroma
      max: 10
      question: "The experience starts with your nose. What scents do you recognize? Fruits? Spices? Sugars? 5 points is one, maybe two weak flavors; 10 is a rich mélange."
    - key: flavor
      label: Flavor
      max: 20
      question: "Taste the spirit. What type of flavors do you experience? How deep are the flavors you notice? 10 points means a couple of light notes, 20 is a rich cornucopia."
    - key: body
      label: Body
      max: 10
      question: "Mouthfeel. How does it coat your tongue and mouth? Is it oily? Thick or thin? 5 points means it is on the thin side, 10 is a nice perfectly even coating."
    - key: complexity
      label: Complexity
      max: 10
      question: "How many different flavor notes do you experience? Do they blend well or stay separated? A 5 means simple and easy; 10 is a beautiful mind-dram."
    - key: balance
      label: Balance
      max: 10
      question: "Are the flavors in equilibrium? Is one too loud or too weak? 5 points means something is out of whack; 10 is perfect in every way."
    - key: finish
      label: Finish
      max: 10
      question: "What's the ending like? How long does it linger in your mouth and throat? Short, medium, long? 5 is short and poor; 10 is lovely, no burns, and great taste."
    - key: uniqueness
      label: Uniqueness
      max: 10
      question: "How special or unusual was the drinking experience? Can include a point or two for presentation. 10 is a unicorn, so don't waste it."
    - key: drinkability
      label: Drinkability
      max: 10
      question: "How much does it make you want to drink more? 5 means you are not excited for your next sip; 10 is a dram you want to jump back into."
    - key: aesthetics
      label: Aesthetics
      max: 5
      question: "Don't forget the vessel that contained the spirit. Iconic shape? Unique labeling? Packaging? What's in the boat?"
    - key: value
      label: Value
      max: 5
      question: "Price and availability. How much did this cost? Is it worth it? How hard is it to find? 5 means the price and availability are right."
  medals:
    - {name: Diamond,  min: 90}
    - {name: Gold,     min: 80}
    - {name: Silver,   min: 70}
    - {name: Bronze,   min: 60}
    - {name: No Medal, min: 0}

aggregate:
  # Career score = mean of counted sittings, rounded half-up for the medal band. SPEC.md §3.6
  rounding: half_up
  show_range: true

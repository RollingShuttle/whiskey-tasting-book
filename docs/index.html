<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- The page of the Tasting Book iPhone app (guide/IOS-APP.md): the app's WKWebView loads it
       from inside the app. viewport-fit=cover is what lets the safe-area insets below mean
       anything (SPEC.md §9.2). maximum-scale / user-scalable: this is an app, not a page —
       nothing on it needs the whole screen magnified, and a double-tap that zoomed was the one
       gesture that felt like a web site. -->
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <title>Whiskey Tasting Book</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- The app has no browser chrome and no edge-swipe back, so every pushed screen carries its
       own chevron (SPEC.md §9.2). -->
  <header class="bar" id="bar">
    <button class="back" id="back" type="button" aria-label="Back" hidden>
      <span aria-hidden="true">&#8249;</span>
    </button>
    <h1 id="title">Collection</h1>
    <span class="net" id="net" aria-live="polite"></span>
    <!-- A thin brass line while a sync runs, so it shows from every screen. -->
    <div class="syncbar" id="syncbar" hidden></div>
  </header>

  <main id="main">
    <section class="screen" id="screen-collection"></section>
    <section class="screen" id="screen-detail" hidden></section>
    <section class="screen" id="screen-sitting" hidden></section>
    <section class="screen" id="screen-move" hidden></section>
    <section class="screen" id="screen-score" hidden></section>
    <section class="screen" id="screen-add" hidden></section>
    <section class="screen" id="screen-compare" hidden></section>
    <section class="screen" id="screen-analysis" hidden></section>
    <section class="screen" id="screen-sync" hidden></section>
  </main>

  <!-- Hidden while the keyboard is up so Submit stays reachable (SPEC.md §9.2). -->
  <nav class="tabs" id="tabs" aria-label="Sections">
    <button class="tab active" data-tab="collection" type="button">
      <span class="glyph" aria-hidden="true">&#9776;</span>Collection
    </button>
    <button class="tab" data-tab="add" type="button">
      <span class="glyph" aria-hidden="true">+</span>Add
    </button>
    <button class="tab" data-tab="compare" type="button">
      <span class="glyph" aria-hidden="true">&#8646;</span>Compare
    </button>
    <button class="tab" data-tab="analysis" type="button">
      <span class="glyph" aria-hidden="true">&#9678;</span>Analysis
    </button>
    <button class="tab" data-tab="sync" type="button">
      <span class="glyph" aria-hidden="true">&#8645;</span><span id="tab-sync-label">Sync</span>
      <span class="badge" id="tab-badge" hidden></span>
    </button>
  </nav>

  <script src="config.js"></script>
  <script src="native.js"></script>
  <script src="store.js"></script>
  <script src="graph.js"></script>
  <script src="sync.js"></script>
  <script src="table.js"></script>
  <script src="analysis.js"></script>
  <script src="compare.js"></script>
  <script src="xlsx.js"></script>
  <script src="app.js"></script>
</body>
</html>
